name: CI

# Read-only by default; jobs that need more say so themselves.
permissions:
  contents: read

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  # The repository is public: every commit in the history is scanned for secrets.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: |
          curl -sSfLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --no-banner --redact .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv run --no-project --with ruff==0.15.21 ruff check .
      - run: uv run --no-project --with ruff==0.15.21 ruff format --check .

  test:
    # ubuntu-latest (26.04) has no Python 3.9; keep testing the oldest supported Python
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # ArcGIS Pro 3.0 ships Python 3.9 and 3.7 ships 3.13; the toolbox runs on both.
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      # arcpy only exists inside ArcGIS Pro. tests/conftest.py installs a stub so
      # the pure parts of geometry, layers and the toolbox run here; anything
      # that draws or converts data is checked on a licensed machine.
      - run: python -m pytest tests -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash scripts/package.sh

  dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          # The add-in targets .NET 8 (ArcGIS Pro 3.5+); the tests run on that runtime.
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet build SateAIs.sln -c Release
      - run: dotnet test tests/SateAIs.Core.Tests -c Release --no-build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SateAIs.AddIn.esriAddinX
          path: src/SateAIs.AddIn/bin/Release/SateAIs.AddIn.esriAddinX
